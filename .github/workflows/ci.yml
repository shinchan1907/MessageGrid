name: Continuous Integration & Delivery

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-analyse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json, openssl, mbstring
          tools: phpstan

      - name: Run PHPStan Static Analysis
        run: phpstan analyse files/custom/Espo/Modules/WhatsApp/ --level=5 --error-format=github

  verification-suite:
    runs-on: ubuntu-latest
    needs: lint-and-analyse
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json, openssl, mbstring

      - name: Execute Standalone Verification Tests
        run: php tests/run_tests.php

  compile-release:
    runs-on: ubuntu-latest
    needs: verification-suite
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Package Release Bundle (PHP CLI Compiler)
        run: php build_package.php

      - name: Archive Production Artifact
        uses: actions/upload-artifact@v3
        with:
          name: espo-whatsapp-integration-v1.0.0
          path: whatsapp-integration-1.0.0.zip
